.game:before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(.65px);
  -webkit-backdrop-filter:blur(.65px);
}
.counter{position:absolute;z-index:20;top:26px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:28px;background:#fff8e9ee;border:3px solid #f2bd68;box-shadow:0 5px 12px #77552d33;color:#50351f;font-size:20px;font-weight:900;white-space:nowrap}.counter b{font-size:27px;color:#70a800;margin-left:9px}
.guide{position:absolute;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 23px;border-radius:24px;background:#fff8e9ee;border:2px solid #efc277;box-shadow:0 4px 10px #6c4b2430;color:#563b25;font-weight:800;font-size:16px;white-space:nowrap}
.plate{position:absolute;z-index:8;left:50%;bottom:76px;transform:translateX(-50%);width:250px;height:90px;border-radius:50%;background:radial-gradient(ellipse,#fffdf4 0 53%,#f4dfb8 55% 70%,#d9a969 72% 76%,#fff3d7 78%);box-shadow:0 10px 14px #60431e38,inset 0 3px 5px #fff}.plate.plate-pop{animation:platePop .38s cubic-bezier(.2,1.7,.45,1)}
@keyframes platePop{
  0%{transform:translateX(-50%) scale(1)}
  45%{transform:translateX(-50%) translateY(-8px) scale(1.12)}
  100%{transform:translateX(-50%) scale(1)}
}
.plate:after{content:"";position:absolute;inset:15px 25px;border-radius:50%;border:2px solid #ead3a7}
.pea{
  position:absolute;z-index:12;width:56px;height:56px;border-radius:50%;
  cursor:grab;touch-action:none;
  background:radial-gradient(circle at 32% 25%,#f1ff9a 0 8%,#a7dc21 13% 40%,#70ae0b 68%,#4b8105 100%);
  border:3px solid rgba(61,104,11,.78);
  outline:2px solid rgba(255,255,238,.72);
  outline-offset:1px;
  box-shadow:
    inset -6px -8px 10px #356e0a42,
    0 3px 0 rgba(46,80,9,.30),
    0 6px 11px rgba(31,51,12,.28),
    0 0 8px rgba(255,255,220,.58);
}.pea:before{content:"";position:absolute;width:11px;height:8px;border-radius:50%;left:12px;top:9px;background:#fff9;transform:rotate(-25deg)}.pea.dragging{z-index:30;transform:scale(1.12)}.pea.collected{pointer-events:none;animation:plop .4s ease forwards}@keyframes plop{50%{transform:scale(1.2) rotate(180deg)}100%{transform:scale(.5) rotate(360deg);opacity:0}}
.success{display:none;position:absolute;z-index:50;inset:0;place-items:center;background:#fff8df20;backdrop-filter:blur(1px)}.success.show{display:grid}.success div{font-size:74px;font-weight:1000;color:#ff982c;-webkit-text-stroke:3px #fff;text-shadow:0 5px 0 #df741f,0 10px 20px #57341455;animation:pop .65s cubic-bezier(.2,1.6,.4,1),glow 1s infinite alternate}@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes glow{to{filter:drop-shadow(0 0 18px #fff28b)}}

</style></head><body><main class="game" id="game">
<div class="counter">🟢 콩 모은 개수 <b><span id="score">0</span> / 8</b></div>
<div class="pea" style="left:15%;top:47%"></div><div class="pea" style="left:32%;top:58%"></div><div class="pea" style="left:49%;top:40%"></div><div class="pea" style="left:65%;top:53%"></div><div class="pea" style="left:81%;top:45%"></div><div class="pea" style="left:20%;top:69%"></div><div class="pea" style="left:57%;top:68%"></div><div class="pea" style="left:78%;top:70%"></div>
<div class="plate" id="plate"></div><div class="guide">콩을 접시로 옮겨주세요!</div><div class="success" id="success"><div>성공!</div></div>
</main><script>
const game=document.getElementById('game'),plate=document.getElementById('plate'),scoreEl=document.getElementById('score'),success=document.getElementById('success'),peas=[...document.querySelectorAll('.pea')];let score=0;
function inPlate(p){let a=p.getBoundingClientRect(),b=plate.getBoundingClientRect(),x=a.left+a.width/2,y=a.top+a.height/2;return x>b.left&&x<b.right&&y>b.top&&y<b.bottom}
peas.forEach(p=>{let drag=false,dx=0,dy=0;p.onpointerdown=e=>{drag=true;p.classList.add('dragging');p.setPointerCapture(e.pointerId);let r=p.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top};p.onpointermove=e=>{if(!drag)return;let g=game.getBoundingClientRect(),x=e.clientX-g.left-dx,y=e.clientY-g.top-dy;x=Math.max(0,Math.min(g.width-p.offsetWidth,x));y=Math.max(0,Math.min(g.height-p.offsetHeight,y));p.style.left=x+'px';p.style.top=y+'px'};p.onpointerup=e=>{if(!drag)return;drag=false;p.classList.remove('dragging');if(inPlate(p)){let r=plate.getBoundingClientRect(),g=game.getBoundingClientRect();p.style.left=(r.left-g.left+r.width/2-p.offsetWidth/2)+'px';p.style.top=(r.top-g.top+r.height/2-p.offsetHeight/2)+'px';p.classList.add('collected');scoreEl.textContent=++score;plate.classList.remove('plate-pop');void plate.offsetWidth;plate.classList.add('plate-pop');if(score===8)setTimeout(()=>success.classList.add('show'),430)}}});
</script></body></html>
